<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriAI - Farmer Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body d-flex align-items-center justify-content-center min-vh-100">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card auth-card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="auth-header text-center p-4 bg-gradient-agri text-white">
                        <div class="brand-logo mb-2">
                            <span class="fs-1">🌱</span>
                        </div>
                        <h2 class="fw-bold m-0">AgriAI</h2>
                        <p class="small text-white-50 m-0 mt-1">Smart Agronomy & Crop Decision Platform</p>
                    </div>
                    
                    <div class="card-body p-4 p-md-5 bg-white">
                        {% if error %}
                            <div class="alert alert-danger alert-dismissible fade show rounded-3 small" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endif %}

                        <form action="{{ url_for('auth.login') }}" method="POST" class="auth-form">
                            <div class="mb-3">
                                <label for="identifier" class="form-label fw-semibold text-dark">Mobile Number or Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-fill text-muted"></i></span>
                                    <input type="text" class="form-control bg-light border-start-0 ps-0" id="identifier" name="identifier" placeholder="e.g. 9876543210 or farmer@example.com" required autocomplete="username">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold text-dark">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                                    <input type="password" class="form-control bg-light border-start-0 ps-0" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-agri-primary w-100 py-2.5 fw-semibold shadow-sm mb-3">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login to Dashboard
                            </button>
                        </form>

                        <div class="divider my-3 text-center position-relative">
                            <span class="px-3 bg-white text-muted small">OR TEST INSTANTLY</span>
                        </div>

                        <a href="{{ url_for('auth.demo_login') }}" class="btn btn-outline-success w-100 py-2.5 fw-semibold border-2 rounded-3 mb-4 d-flex align-items-center justify-content-center">
                            <i class="bi bi-lightning-charge-fill text-warning me-2 fs-5"></i>
                            <span>1-Click Demo Farmer Login</span>
                        </a>

                        <div class="text-center">
                            <p class="text-muted small m-0">
                                New to AgriAI? 
                                <a href="{{ url_for('auth.register') }}" class="text-agri-primary text-decoration-none fw-semibold ms-1">Register New Account</a>
                            </p>
                        </div>
                    </div>

                    <div class="card-footer bg-light text-center py-3 border-0">
                        <small class="text-muted"><i class="bi bi-shield-check me-1 text-success"></i> Secure Agronomic Data Platform</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
