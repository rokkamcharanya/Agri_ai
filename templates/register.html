<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriAI - Farmer Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body d-flex align-items-center justify-content-center min-vh-100 py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card auth-card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="auth-header text-center p-4 bg-gradient-agri text-white">
                        <div class="brand-logo mb-2">
                            <span class="fs-1">🌱</span>
                        </div>
                        <h2 class="fw-bold m-0">Farmer Registration</h2>
                        <p class="small text-white-50 m-0 mt-1">Join AgriAI to protect and boost your crop yields</p>
                    </div>

                    <div class="card-body p-4 p-md-5 bg-white">
                        {% if error %}
                            <div class="alert alert-danger alert-dismissible fade show rounded-3 small" role="alert">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endif %}

                        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold text-dark">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person me-1 text-muted"></i></span>
                                    <input type="text" class="form-control bg-light border-start-0 ps-0" id="name" name="name" placeholder="e.g. Farmer Ramesh" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="mobile" class="form-label fw-semibold text-dark">Mobile Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone me-1 text-muted"></i></span>
                                        <input type="tel" class="form-control bg-light border-start-0 ps-0" id="mobile" name="mobile" placeholder="10-digit mobile">
                                    </div>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label fw-semibold text-dark">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope me-1 text-muted"></i></span>
                                        <input type="email" class="form-control bg-light border-start-0 ps-0" id="email" name="email" placeholder="farmer@example.com">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="crop_name" class="form-label fw-semibold text-dark">Primary Crop</label>
                                <select class="form-select bg-light" id="crop_name" name="crop_name">
                                    <option value="Paddy" selected>🌾 Paddy / Rice</option>
                                    <option value="Cotton">☁️ Cotton</option>
                                    <option value="Chilli">🌶️ Chilli</option>
                                    <option value="Maize">🌽 Maize</option>
                                    <option value="Groundnut">🥜 Groundnut</option>
                                    <option value="Wheat">🌾 Wheat</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold text-dark">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock me-1 text-muted"></i></span>
                                    <input type="password" class="form-control bg-light border-start-0 ps-0" id="password" name="password" placeholder="Create password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-agri-primary w-100 py-2.5 fw-semibold shadow-sm mb-3">
                                <i class="bi bi-check-circle-fill me-2"></i>Create Farmer Account
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <p class="text-muted small m-0">
                                Already registered? 
                                <a href="{{ url_for('auth.login') }}" class="text-agri-primary text-decoration-none fw-semibold ms-1">Login here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
